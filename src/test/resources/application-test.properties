# Base de datos H2 en memoria para pruebas de integracion
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Deshabilitar email en pruebas
brevo.api.key=test-key
brevo.from.email=test@test.com
brevo.from.name=Test

# JWT para pruebas
jwt.secret=test-secret-key-for-integration-tests-minimum-length
jwt.expiration=3600000

server.port=0